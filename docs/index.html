<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Dev Notes</title>
<meta name="description" content="Daily notes on AI agents, infrastructure, and developer tooling.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple: #9437FF; --purple-deep: #6B21C9; --pink: #F73DF1; --blue: #3FD9FB;
    --ink: #171321; --ink-soft: #4a4658; --ink-dim: #7d7a89;
    --line: #ECE7F5; --surface: #FFFFFF; --surface-tint: #FAF8FE;
    --radius-lg: 20px; --radius: 16px;
    --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "Geist Mono", "SF Mono", Consolas, monospace;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; font-family: var(--sans); color: var(--ink);
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(148,55,255,0.06), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 10%, rgba(247,61,241,0.05), transparent 60%),
      var(--surface);
    line-height: 1.55; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
  }
  a{ color: var(--purple-deep); text-decoration:none; }
  a:hover{ color: var(--pink); }
  .page{ max-width: 760px; margin: 0 auto; padding: 48px 24px 90px; }
  .site-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:44px; }
  .site-title{ font-weight:700; font-size:1.1rem; letter-spacing:-0.02em; }
  .site-title a{ color: var(--ink); }
  .site-tagline{ font-family: var(--mono); font-size:12px; color: var(--ink-dim); }
  footer{ margin-top:60px; padding-top:24px; border-top:1px solid var(--line); font-family: var(--mono); font-size:0.78rem; color: var(--ink-dim); }

  .kicker{ display:inline-block; font-family: var(--mono); font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:#fff; background: linear-gradient(90deg,var(--purple),var(--pink)); padding:5px 12px; border-radius:999px; margin-bottom:18px; }
  .lede{ font-size:1.05rem; color: var(--ink-soft); max-width:60ch; margin-bottom:40px; }
  .post-list{ display:flex; flex-direction:column; gap:16px; }
  .post-card{ display:block; background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding:20px 22px; box-shadow: 0 8px 24px rgba(148,55,255,0.06); transition: border-color .15s, transform .15s; }
  .post-card:hover{ border-color: var(--purple); transform: translateX(3px); }
  .post-date{ font-family: var(--mono); font-size:11.5px; color: var(--ink-dim); margin-bottom:8px; }
  .post-title{ font-size:1.15rem; font-weight:600; color: var(--ink); margin-bottom:6px; letter-spacing:-0.01em; }
  .post-card:hover .post-title{ color: var(--purple-deep); }
  .post-desc{ color: var(--ink-soft); font-size:0.92rem; margin-bottom:10px; }
  .post-tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .post-tag{ font-family: var(--mono); font-size:10.5px; color: var(--purple-deep); background: var(--surface-tint); border:1px solid var(--line); border-radius:999px; padding:3px 9px; }
  .empty{ color: var(--ink-dim); font-size:0.9rem; }
</style>
</head>
<body>
<div class="page">
  <header class="site-header">
    <span class="site-title"><a href="./">Daily Dev Notes</a></span>
    <span class="site-tagline">AI agents · infra · tooling</span>
  </header>
  <main>
    <span class="kicker">Blog</span>
    <p class="lede">Interactive, hands-on write-ups — one topic at a time, published as they're finished.</p>
    <div class="post-list" id="postList">
      <p class="empty">Loading posts…</p>
    </div>
  </main>
  <footer>Hosted on GitHub Pages</footer>
</div>

<script>
(function () {
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  fetch('posts.json')
    .then(function (r) { return r.json(); })
    .then(function (posts) {
      posts.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
      var list = document.getElementById('postList');
      if (!posts.length) {
        list.innerHTML = '<p class="empty">No posts yet.</p>';
        return;
      }
      list.innerHTML = posts.map(function (p) {
        var tags = (p.tags || []).map(function (t) {
          return '<span class="post-tag">' + esc(t) + '</span>';
        }).join('');
        return (
          '<a class="post-card" href="posts/' + encodeURIComponent(p.slug) + '.html">' +
            '<div class="post-date">' + esc(p.date) + (p.readTime ? ' · ' + esc(p.readTime) : '') + '</div>' +
            '<div class="post-title">' + esc(p.title) + '</div>' +
            '<div class="post-desc">' + esc(p.description || '') + '</div>' +
            '<div class="post-tags">' + tags + '</div>' +
          '</a>'
        );
      }).join('');
    })
    .catch(function () {
      document.getElementById('postList').innerHTML = '<p class="empty">Could not load posts.json.</p>';
    });
})();
</script>
</body>
</html>
